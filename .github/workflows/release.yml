name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Pack
        run: npm pack

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            *.tgz

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: sigdb
      url: https://www.npmjs.com/package/@reekeer/sigdb

    permissions:
      id-token: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifact/

      - name: Publish to npm
        run: npm publish artifact/*.tgz --access public

  github-release:
    needs: npm
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifact/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*.tgz
          generate_release_notes: true
